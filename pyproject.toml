[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-scraper"
version = "0.1.0"
description = "Recipe extraction pipeline with deterministic regression fixtures and live benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "extruct>=0.18",
  "w3lib>=2.2",
  "ingredient_parser_nlp>=2.8,<3",
]

[project.optional-dependencies]
fetch = ["scrapling[fetchers]"]
rewrite = ["openai", "python-dotenv"]
gui = ["PyQt6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
all = ["recipe-scraper[fetch,rewrite,gui,dev]"]

[project.scripts]
recipe-scraper = "recipe_scraper.extractor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
markers = [
  "integration: deterministic integration tests over local HTML fixtures",
  "live: network-dependent tests; not run by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
